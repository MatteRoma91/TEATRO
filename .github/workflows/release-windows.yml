name: Build Windows (TeatroApp.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller teatroapp.spec --noconfirm

      - name: Docs accanto all'exe
        run: |
          copy INSTALLA_WINDOWS.txt dist\TeatroApp\
          copy LEGGIMI.txt dist\TeatroApp\

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ver = (python -c "from teatro import __version__; print(__version__)")
          $zip = "TeatroApp-${ver}-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "dist\TeatroApp\*" -DestinationPath $zip
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeatroApp-Windows
          path: TeatroApp-*-Windows-x64.zip
          retention-days: 90

      - name: Publish GitHub Release (latest build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TeatroApp Windows — build ${{ github.run_number }}
          body: |
            Pacchetto **portable** per Windows 64 bit (non serve Python né MATLAB).

            1. Scarica `TeatroApp-*-Windows-x64.zip`
            2. Estrai in una cartella (es. `C:\TeatroApp`)
            3. Avvia `TeatroApp.exe` (non spostare solo l'exe: serve anche `_internal\`)

            SmartScreen «Editore sconosciuto»: **Ulteriori informazioni** → **Esegui comunque**.
            Se l'icona sparisce, controlla Windows Defender (vedi `INSTALLA_WINDOWS.txt` nello zip).

            I tuoi spettacoli si salvano nella sottocartella `spettacoli\`.
          files: TeatroApp-*-Windows-x64.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
